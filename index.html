<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snackible — Command Centre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e4e9f0;
      --border-strong: #d0d7e3;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo-icon {
      width: 42px;
      height: 38px;
      background: linear-gradient(135deg, #02514F, #04756f);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px 6px;
    }

    .nav-logo-icon-top {
      font-size: 9px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .nav-logo-icon-bottom {
      font-size: 6px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
      margin-top: 1px;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.4; }
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 32px 0;
    }

    .page-header { margin-bottom: 40px; }

    .page-header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .page-header p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      main { padding: 16px 16px 40px; }
    }

    .rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
      transition: box-shadow 120ms ease, transform 120ms ease;
    }
    .row:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }

    .row-left {
      padding: 14px 12px;
      display: flex; flex-direction: column; justify-content: flex-start; gap: 6px;
      border-right: 1px solid var(--border);
    }
    .row-icon { font-size: 20px; margin-bottom: 6px; }
    .row-badge {
      font-size: 8px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 20px; display: inline-block; margin-bottom: 5px;
    }
    .row-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }


    .row-right {
      padding: 10px 12px;
      background: var(--surface);
      display: flex;
      gap: 0;
    }

    .row-section { flex: 1; display: flex; flex-direction: column; }
    .row-section-title {
      font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 7px; padding-bottom: 5px;
      border-bottom: 0.5px solid var(--border);
    }
    .row-kpis { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-vdivider { width: 1px; background: var(--border); margin: 0 12px; flex-shrink: 0; }

    .blue   { --c: #3b82f6; --ibg: #eff6ff; --badge-bg: #dbeafe; --badge-c: #1d4ed8; }
    .red    { --c: #ef4444; --ibg: #fef2f2; --badge-bg: #fee2e2; --badge-c: #b91c1c; }
    .green  { --c: #22c55e; --ibg: #f0fdf4; --badge-bg: #dcfce7; --badge-c: #15803d; }
    .purple { --c: #a855f7; --ibg: #faf5ff; --badge-bg: #f3e8ff; --badge-c: #7e22ce; }
    .teal   { --c: #14b8a6; --ibg: #f0fdfa; --badge-bg: #ccfbf1; --badge-c: #0f766e; }

    .row-left  { background: var(--ibg); }
    .row-badge { background: var(--badge-bg); color: var(--badge-c); }

    footer {
      max-width: 1040px;
      margin: 32px auto 0;
      padding: 0 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .row-kpis {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .row-kpis .metric-pill {
      flex: 1;
      min-width: 80px;
    }

    .metric-pill {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--ibg);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .metric-pill-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .metric-pill-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .metric-pill-value.positive { color: #16a34a; }
    .metric-pill-value.negative { color: #dc2626; }
    .metric-pill-value.neutral  { color: var(--c); }

    .metric-divider {
      width: 100%;
      height: 1px;
      background: var(--ibg);
      margin: 12px 0 10px;
    }

    .metric-context {
      font-size: 10px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .metric-context-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .metric-context-dot.warn { background: #f59e0b; }
    .metric-context-dot.bad  { background: #ef4444; }

    .metric-loading {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .metric-loading-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--c);
      animation: blink 1.2s infinite;
    }
    .metric-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .metric-loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
    .metric-error { font-size:11px; color:#f87171; margin-top:8px; }
    .metric-tag {
      display:inline-block;
      font-size:9px; font-weight:700;
      padding:2px 6px; border-radius:10px;
      background:var(--ibg); color:var(--c);
      letter-spacing:0.05em; text-transform:uppercase;
      margin-right:4px;
    }
  </style>
</head>

      </div>

<script>
const MIS_URL  = 'https://script.google.com/macros/s/AKfycbwqu5ke62_gkjT0mCmhUT3he-vv38hrE5wPDKIMpwPbpPoWKLP3Dwhh-5JwvrhlR8Eu/exec';
const BURN_URL = 'https://script.google.com/macros/s/AKfycbyMC3y3yAWbcGjMTSAholsJYG5KhSAdTdMxI3CWX-MKW8QXrdM0EHuLb_fo49z6fXYw/exec';
const CM2_URL  = 'https://script.google.com/macros/s/AKfycbzZWmiZk9RCmg6RTqqgObYjzMn545VGHorUQg66yHo1R-f9NbpDqyjBqRXlnJWpLHU-/exec';
const QCOM_URL = 'https://script.google.com/macros/s/AKfycbxWNCuc8rXgrmzNqxi6b0IGoaizxqj3f9R_nFxXFqwTkgEKKo3-rvTC_ZW1bpy7PWCm/exec';

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1e7) return sign + '₹' + (abs/1e7).toFixed(2) + 'Cr';
  if (abs >= 1e5) return sign + '₹' + (abs/1e5).toFixed(2) + 'L';
  if (abs >= 1e3) return sign + '₹' + (abs/1e3).toFixed(1) + 'K';
  return sign + '₹' + abs.toFixed(0);
}
function fmtPct(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
function cls(n) { return n < 0 ? 'negative' : 'positive'; }
function loadingHTML() { return '<div class="metric-loading"><div class="metric-loading-dot"></div><div class="metric-loading-dot"></div><div class="metric-loading-dot"></div>&nbsp;Loading…</div>'; }
function errorHTML(msg) { return '<div class="metric-error">⚠ ' + msg + '</div>'; }

function pillsHTML(pills, context) {
  const grid = pills.map(p => `
    <div class="metric-pill">
      <span class="metric-pill-label">${p.label}</span>
      <span class="metric-pill-value ${p.cls||''}">${p.value}</span>
    </div>`).join('');
  return `<div class="card-metrics">${grid}</div>
    <div class="metric-divider"></div>
    <div class="metric-context"><span class="metric-context-dot ${context.dot||''}"></span>${context.text}</div>`;
}

// ── MIS ──
async function loadMIS() {
  const ytdEl = document.getElementById('mis-ytd');
  const latestEl = document.getElementById('mis-latest');
  try {
    const r = await fetch(`${MIS_URL}?action=getData`);
    const j = await r.json();
    if (j.error) { ytdEl.innerHTML = errorHTML(j.error); return; }

    const months = j.months || [];
    const rows = j.rows || [];
    if (!months.length) { ytdEl.innerHTML = errorHTML('No MIS data'); return; }

    const apr26Idx = months.indexOf('Apr-26');
    const ytdMonths = apr26Idx >= 0 ? months.slice(apr26Idx) : months;
    const lastM = ytdMonths[ytdMonths.length - 1];
    const firstM = ytdMonths[0];

    const val = (label, m) => {
      const row = rows.find(r => r.label === label);
      return row ? (row.values?.[m] ?? null) : null;
    };

    let ytdRev = 0, ytdGM = 0, ytdCM2 = 0, ytdEBITDA = 0;
    ytdMonths.forEach(m => {
      ytdRev    += val('Total Net Revenue', m) ?? val('Total Revenue', m) ?? 0;
      ytdGM     += val('Gross margin', m) ?? val('Gross Margin', m) ?? 0;
      ytdCM2    += val('Total CM2', m) ?? 0;
      ytdEBITDA += val('EBITDA', m) ?? 0;
    });

    const ytdGMpct     = ytdRev ? (ytdGM / ytdRev * 100) : null;
    const ytdCM2pct    = ytdRev ? (ytdCM2 / ytdRev * 100) : null;
    const ytdEBITDApct = ytdRev ? (ytdEBITDA / ytdRev * 100) : null;

    const fmtMon = s => s.replace('-', "'");
    ytdEl.innerHTML = `
      <div class="row-section-title">FY27 YTD · ${fmtMon(firstM)}–${fmtMon(lastM)}</div>
      <div class="row-kpis">
        <div class="metric-pill"><span class="metric-pill-label">Revenue</span><span class="metric-pill-value neutral">${fmt(ytdRev)}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">Gross Margin%</span><span class="metric-pill-value ${ytdGMpct>=0?'positive':'negative'}">${ytdGMpct!==null?ytdGMpct.toFixed(2)+'%':'—'}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">CM2%</span><span class="metric-pill-value ${ytdCM2pct>=0?'positive':'negative'}">${ytdCM2pct!==null?ytdCM2pct.toFixed(2)+'%':'—'}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">EBITDA%</span><span class="metric-pill-value ${ytdEBITDApct>=0?'positive':'negative'}">${ytdEBITDApct!==null?ytdEBITDApct.toFixed(2)+'%':'—'}</span></div>
      </div>`;

    const latestRev    = val('Total Net Revenue', lastM) ?? val('Total Revenue', lastM);
    const latestGM     = val('Gross margin', lastM) ?? val('Gross Margin', lastM);
    const latestCM2    = val('Total CM2', lastM);
    const latestEBITDA = val('EBITDA', lastM);
    const latestGMpct     = latestRev ? (latestGM / latestRev * 100) : null;
    const latestCM2pct    = latestRev ? (latestCM2 / latestRev * 100) : null;
    const latestEBITDApct = latestRev ? (latestEBITDA / latestRev * 100) : null;

    latestEl.innerHTML = `
      <div class="row-section-title">${fmtMon(lastM)} · Latest Month</div>
      <div class="row-kpis">
        <div class="metric-pill"><span class="metric-pill-label">Revenue</span><span class="metric-pill-value neutral">${fmt(latestRev)}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">Gross Margin%</span><span class="metric-pill-value ${latestGMpct>=0?'positive':'negative'}">${latestGMpct!==null?latestGMpct.toFixed(2)+'%':'—'}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">CM2%</span><span class="metric-pill-value ${latestCM2pct>=0?'positive':'negative'}">${latestCM2pct!==null?latestCM2pct.toFixed(2)+'%':'—'}</span></div>
        <div class="metric-pill"><span class="metric-pill-label">EBITDA%</span><span class="metric-pill-value ${latestEBITDApct>=0?'positive':'negative'}">${latestEBITDApct!==null?latestEBITDApct.toFixed(2)+'%':'—'}</span></div>
      </div>`;

  } catch(e) {
    ytdEl.innerHTML = errorHTML('Failed: ' + e.message);
  }
}

// ── CASH BURN ──
async function loadBurn() {
  const el = document.getElementById('burn-metrics');
  try {
    const now = new Date();
    const makeMonth = (offset) => {
      const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    };
    const tryMonths = [makeMonth(0), makeMonth(-1), makeMonth(-2)];
    let latestData = null, latestMonth = null;
    for (const m of tryMonths) {
      try {
        const url = `${BURN_URL}?action=getBurnData&payload=${encodeURIComponent(JSON.stringify({month:m}))}`;
        const r = await fetch(url);
        const j = await r.json();
        if (j && !j.error && j.summary) { latestData = j; latestMonth = m; break; }
      } catch(e) { continue; }
    }
    if (!latestData) { el.innerHTML = errorHTML('No burn data available'); return; }

    const monthLabel = new Date(latestMonth+'-01').toLocaleString('en-IN',{month:'short',year:'2-digit'}).replace(' ', "'");
    const s = latestData.summary;
    const netBurn    = s.burn ?? null;
    const totalExp   = s.totalExpenses ?? null;
    const totalRev   = s.totalRevenue ?? null;
    const latestCashFlow = netBurn !== null ? (netBurn + (s.financing ?? 0) + (s.investing ?? 0)) : null;

    const ytdMonths = ['2026-04','2026-05','2026-06','2026-07','2026-08'].filter(m => m <= latestMonth);
    let ytdBurn = 0, ytdCashFlow = 0, ytdSweepIn = 0, ytdTotalRev = 0, ytdFetched = 0;
    await Promise.all(ytdMonths.map(async m => {
      try {
        const url = `${BURN_URL}?action=getBurnData&payload=${encodeURIComponent(JSON.stringify({month:m}))}`;
        const r = await fetch(url);
        const j = await r.json();
        if (j && !j.error && j.summary) {
          ytdBurn += j.summary.burn ?? 0;
          const financing = j.summary.financing ?? 0;
          const investing  = j.summary.investing  ?? 0;
          ytdCashFlow += (j.summary.burn ?? 0) + financing + investing;
          ytdSweepIn  += j.summary.sweepIn ?? 0;
          ytdTotalRev += j.summary.totalRevenue ?? 0;
          ytdFetched++;
        }
      } catch(e) {}
    }));

    el.innerHTML = `
      <div class="row-section">
        <div class="row-section-title">FY27 YTD Apr–${monthLabel}</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Total Revenue</span><span class="metric-pill-value positive">${ytdFetched ? fmt(ytdTotalRev) : '—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">YTD Net Burn</span><span class="metric-pill-value ${ytdBurn < 0 ? 'negative' : 'positive'}">${ytdFetched ? fmt(ytdBurn) : '—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">YTD Cash Flow</span><span class="metric-pill-value ${ytdCashFlow >= 0 ? 'positive' : 'negative'}">${ytdFetched ? fmt(ytdCashFlow) : '—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">YTD Sweep-Ins</span><span class="metric-pill-value neutral">${ytdFetched ? fmt(ytdSweepIn) : '—'}</span></div>
        </div>
      </div>
      <div class="row-vdivider"></div>
      <div class="row-section">
        <div class="row-section-title">${monthLabel} · Latest Month</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Revenue</span><span class="metric-pill-value positive">${fmt(totalRev)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Net Burn</span><span class="metric-pill-value ${netBurn !== null && netBurn < 0 ? 'negative' : 'positive'}">${fmt(netBurn)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Cash Flow</span><span class="metric-pill-value ${latestCashFlow !== null && latestCashFlow >= 0 ? 'positive' : 'negative'}">${fmt(latestCashFlow)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Sweep-Ins</span><span class="metric-pill-value neutral">${fmt(s.sweepIn ?? 0)}</span></div>
        </div>
      </div>`;
  } catch(e) { el.innerHTML = errorHTML('Failed: ' + e.message); }
}

// ── CM2 ──
async function loadCM2() {
  const el = document.getElementById('cm2-metrics');
  try {
    const r = await fetch(CM2_URL + '?action=loadAllChunks', { cache: 'no-store' });
    const j = await r.json();
    if (!j || j.error) { el.innerHTML = errorHTML('Could not load CM2 data'); return; }

    const cfg  = j.config || {};
    const data = j.data   || {};

    const MONTHS = [
      'April 2025','May 2025','June 2025','July 2025','August 2025','September 2025',
      'October 2025','November 2025','December 2025','January 2026','February 2026','March 2026',
      'April 2026','May 2026','June 2026','July 2026','August 2026','September 2026',
      'October 2026','November 2026','December 2026',
    ];
    const portals = ['blinkit', 'zepto', 'instamart'];
    const pLabel  = { blinkit: 'Blinkit', zepto: 'Zepto', instamart: 'Instamart' };
    const dKey    = (p, m) => p + '_' + m;
    const monthShort = m => { const p = m.split(' '); return p[0].slice(0,3) + ' ' + p[1].slice(2); };

    const allMonths = MONTHS.filter(m => portals.some(p => data[dKey(p, m)]));
    if (!allMonths.length) { el.innerHTML = errorHTML('No CM2 data found'); return; }

    const lastM  = allMonths[allMonths.length - 1];
    const prevM  = allMonths.length > 1 ? allMonths[allMonths.length - 2] : null;
    const apr26Idx = allMonths.indexOf('April 2026');
    const cumMonths = apr26Idx >= 0 ? allMonths.slice(apr26Idx) : [];

    function calcTotals(entry, portalCfg) {
      const skus    = entry.skus    || [];
      const nlcSkus = entry.nlcSkus || [];
      const pt      = entry.portalTotals || {};
      const nlcPT   = entry.nlcTotals    || {};
      const commPct = (+(portalCfg.commission || 35)) / 100;
      const taxPct  = (+(portalCfg.tax        || 5))  / 100;
      const dePct   = (+(portalCfg.directExp  || 2.9))/ 100;
      const labPct  = (+(portalCfg.labour     || 2))  / 100;
      const logPct  = (+(portalCfg.logistics  || 8))  / 100;

      let gmv = 0, netSales = 0, cm1 = 0;

      skus.forEach(s => {
        const g   = +s.gmv  || 0;
        const qty = +s.qty  || 0;
        let ns;
        if (s.custom && (+s.c_gross > 0 || +s.c_net > 0)) {
          ns = +s.c_net || 0;
        } else {
          ns = (g * (1 - commPct)) / (1 + taxPct);
        }
        const cogs = (+s.cost || 0) * qty;
        const de   = ns * dePct;
        const gm   = ns - cogs - de;
        const lab  = ns * labPct;
        const log  = ns * logPct;
        gmv      += g;
        netSales += ns;
        cm1      += gm - lab - log;
      });

      nlcSkus.forEach(s => {
        const qty        = +s.qty       || 0;
        const nlcPrice   = +s.nlc_price || 0;
        const grossSales = nlcPrice * qty;
        const ns         = grossSales / (1 + taxPct);
        const cogs       = (+s.cost || 0) * qty;
        const de         = ns * dePct;
        const gm         = ns - cogs - de;
        const lab        = ns * labPct;
        const log        = ns * logPct;
        gmv      += +s.gmv || 0;
        netSales += ns;
        cm1      += gm - lab - log;
      });

      let skuPromos = 0, skuAds = 0, skuVis = 0;
      skus.forEach(s => {
        if (+s.promos     > 0) skuPromos += +s.promos;
        if (+s.ads        > 0) skuAds    += +s.ads;
        if (+s.visibility > 0) skuVis    += +s.visibility;
      });
      nlcSkus.forEach(s => {
        if (+s.ads        > 0) skuAds += +s.ads;
        if (+s.visibility > 0) skuVis += +s.visibility;
      });

      const promos = skuPromos || +(pt.promos || 0);
      const ads    = skuAds    || (+(pt.ads || 0) + +(nlcPT.ads || 0));
      const vis    = skuVis    || (+(pt.vis || 0) + +(nlcPT.vis || 0));

      const cm2 = cm1 - promos - ads - vis;
      return { gmv, netSales, cm2, cm2Pct: netSales > 0 ? cm2 / netSales * 100 : 0, promos, ads, vis };
    }

    let totalGMV_last = 0, totalNS_last = 0, totalCM2_last = 0, totalAdsVis_last = 0, totalPromos_last = 0;
    let totalGMV_prev = 0, totalNS_prev = 0, totalCM2_prev = 0;
    let totalGMV_cum  = 0, totalNS_cum  = 0, totalCM2_cum  = 0, totalAdsVis_cum = 0, totalPromos_cum = 0;
    const portalTags_last = [];
    const portalTags_cum  = {};

    portals.forEach(p => {
      const portalCfg = cfg[p] || { commission:35, tax:5, directExp:2.9, labour:2, logistics:8 };

      const eLast = data[dKey(p, lastM)];
      if (eLast) {
        const t = calcTotals(eLast, eLast.config || portalCfg);
        totalGMV_last += t.gmv; totalNS_last += t.netSales; totalCM2_last += t.cm2;
        totalAdsVis_last += t.ads + t.vis; totalPromos_last += t.promos;
        portalTags_last.push({ label: pLabel[p], pct: t.cm2Pct });
      }

      if (prevM) {
        const ePrev = data[dKey(p, prevM)];
        if (ePrev) {
          const t = calcTotals(ePrev, ePrev.config || portalCfg);
          totalGMV_prev += t.gmv; totalNS_prev += t.netSales; totalCM2_prev += t.cm2;
        }
      }

      let pCumNS = 0, pCumCM2 = 0;
      cumMonths.forEach(m => {
        const e = data[dKey(p, m)];
        if (e) {
          const t = calcTotals(e, e.config || portalCfg);
          totalGMV_cum += t.gmv; totalNS_cum += t.netSales; totalCM2_cum += t.cm2;
          totalAdsVis_cum += t.ads + t.vis; totalPromos_cum += t.promos;
          pCumNS += t.netSales; pCumCM2 += t.cm2;
        }
      });
      portalTags_cum[p] = pCumNS > 0 ? pCumCM2 / pCumNS * 100 : null;
    });

    const blendLast = totalNS_last > 0 ? totalCM2_last / totalNS_last * 100 : null;
    const blendPrev = totalNS_prev > 0 ? totalCM2_prev / totalNS_prev * 100 : null;
    const mom       = blendLast !== null && blendPrev !== null ? blendLast - blendPrev : null;
    const blendCum  = totalNS_cum  > 0 ? totalCM2_cum  / totalNS_cum  * 100 : null;
    const adsVisPct_last = totalNS_last > 0 ? totalAdsVis_last / totalNS_last * 100 : null;
    const promosPct_last = totalNS_last > 0 ? totalPromos_last / totalNS_last * 100 : null;
    const adsVisPct_cum  = totalNS_cum  > 0 ? totalAdsVis_cum  / totalNS_cum  * 100 : null;
    const promosPct_cum  = totalNS_cum  > 0 ? totalPromos_cum  / totalNS_cum  * 100 : null;

    const mkTag = (label, pct) => `<span class="metric-tag">${label}: ${pct!==null?pct.toFixed(2)+'%':'—'}</span>`;

    el.innerHTML = `
      <div class="row-section">
        <div class="row-section-title">FY27 YTD Apr'26–${monthShort(lastM)}</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Net Sales</span><span class="metric-pill-value neutral">${fmt(totalNS_cum)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Blended CM2%</span><span class="metric-pill-value ${blendCum!==null&&blendCum>=0?'positive':'negative'}">${blendCum!==null?blendCum.toFixed(2)+'%':'—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Ads+Vis % NS</span><span class="metric-pill-value ${adsVisPct_cum!==null&&adsVisPct_cum<=15?'positive':'negative'}">${adsVisPct_cum!==null?adsVisPct_cum.toFixed(2)+'%':'—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Promos % NS</span><span class="metric-pill-value negative">${promosPct_cum!==null?promosPct_cum.toFixed(2)+'%':'—'}</span></div>
        </div>
        <div style="display:flex;justify-content:space-around;margin-top:6px;">
          <div style="font-size:9px;font-weight:700;color:#FBAE25;">Blinkit: ${portalTags_cum['blinkit']!==null?portalTags_cum['blinkit'].toFixed(2)+'%':'—'}</div>
          <div style="font-size:9px;font-weight:700;color:#E35C25;">Zepto: ${portalTags_cum['zepto']!==null?portalTags_cum['zepto'].toFixed(2)+'%':'—'}</div>
          <div style="font-size:9px;font-weight:700;color:#4C94D0;">Instamart: ${portalTags_cum['instamart']!==null?portalTags_cum['instamart'].toFixed(2)+'%':'—'}</div>
        </div>
      </div>
      <div class="row-vdivider"></div>
      <div class="row-section">
        <div class="row-section-title">${monthShort(lastM)} · Latest Month</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Net Sales</span><span class="metric-pill-value neutral">${fmt(totalNS_last)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Blended CM2%</span><span class="metric-pill-value ${blendLast!==null&&blendLast>=0?'positive':'negative'}">${blendLast!==null?blendLast.toFixed(2)+'%':'—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Ads+Vis % NS</span><span class="metric-pill-value ${adsVisPct_last!==null&&adsVisPct_last<=15?'positive':'negative'}">${adsVisPct_last!==null?adsVisPct_last.toFixed(2)+'%':'—'}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Promos % NS</span><span class="metric-pill-value negative">${promosPct_last!==null?promosPct_last.toFixed(2)+'%':'—'}</span></div>
        </div>
        <div style="display:flex;justify-content:space-around;margin-top:6px;">
          ${portalTags_last.map((t,i)=>`<div style="font-size:9px;font-weight:700;color:${['#FBAE25','#E35C25','#4C94D0'][i]};">${t.label}: ${t.pct!==null?t.pct.toFixed(2)+'%':'—'}</div>`).join('')}
        </div>
      </div>`;

  } catch(e) { document.getElementById('cm2-metrics').innerHTML = errorHTML('Failed: ' + e.message); }
}

// ── CM2 PROJECTIONS ──
async function loadProjections() {
  const el = document.getElementById('proj-metrics');
  try {
    const r = await fetch(CM2_URL + '?action=loadAllChunks', { cache: 'no-store' });
    const j = await r.json();
    if (!j || j.error) throw new Error('no data');

    const MONTHS = ['April 2025','May 2025','June 2025','July 2025','August 2025','September 2025',
      'October 2025','November 2025','December 2025','January 2026','February 2026','March 2026',
      'April 2026','May 2026','June 2026','July 2026','August 2026','September 2026','October 2026'];
    const pColor = { blinkit:'#FBAE25', zepto:'#E35C25', instamart:'#4C94D0' };
    const pLabel = { blinkit:'Blinkit', zepto:'Zepto', instamart:'Instamart' };
    const portals = ['blinkit','zepto','instamart'];

    // Reconstruct savedProjections from proj||| chunks
    const allData = j.data || {};
    const rebuilt = {};
    Object.keys(allData).forEach(key => {
      if (!key.startsWith('proj_')) return;
      const chunk = allData[key];
      const versionKey = (chunk.month || '') + '__' + (chunk.label || '');
      const portal     = chunk.portal || '';
      if (!rebuilt[versionKey]) rebuilt[versionKey] = { month: chunk.month, label: chunk.label, portals: {} };
      rebuilt[versionKey].portals[portal] = chunk.portalSnap;
    });

    // Fallback to old loadProjections format
    let savedProjections = rebuilt;
    if (!Object.keys(savedProjections).length) {
      const r2 = await fetch(CM2_URL + '?action=loadProjections', { cache: 'no-store' });
      savedProjections = await r2.json() || {};
    }

    if (!Object.keys(savedProjections).length) throw new Error('no projection');

    const monthShortP = m => { const p = (m||'').split(' '); return (p[0]||'').slice(0,3) + "'" + (p[1]||'').slice(2); };

    // Group all versions by month, find latest month
    const byMonth = {};
    Object.keys(savedProjections).forEach(vk => {
      const e = savedProjections[vk];
      const m = e.month || '';
      if (!byMonth[m]) byMonth[m] = {};
      byMonth[m][e.label || 'Base Case'] = e;
    });
    const sortedMonths = Object.keys(byMonth).sort((a,b) => MONTHS.indexOf(a) - MONTHS.indexOf(b));
    const latestMonth = sortedMonths[sortedMonths.length - 1];
    const versionsForMonth = byMonth[latestMonth];

    // Always use Base Case as primary; fallback to whatever exists
    const proj = versionsForMonth['Base Case'] || versionsForMonth[Object.keys(versionsForMonth)[0]];
    if (!proj) throw new Error('no projection');
    const label = 'Base Case';
    const month = monthShortP(proj.month);

    // Helper: aggregate portals for a given projection entry
    function aggProj(entry) {
      let ns=0, cm2=0, promos=0, adsVis=0;
      portals.forEach(p => {
        const portalData = entry.portals?.[p];
        let pns=0, pcm2=0, ppromos=0, padsVis=0;
        if (portalData?.ns !== undefined) {
          pns=+portalData.ns||0; pcm2=+portalData.cm2||0; ppromos=+portalData.promos||0; padsVis=+portalData.ads||0;
        } else {
          (portalData?.skus||[]).forEach(s => { pns+=+s.netSales||0; pcm2+=+s.cm2||0; ppromos+=+s.promos||0; padsVis+=+s.adsVis||0; });
        }
        ns+=pns; cm2+=pcm2; promos+=ppromos; adsVis+=padsVis;
      });
      return { ns, cm2, promos, adsVis, cm2Pct: ns>0?cm2/ns*100:0, promosPct: ns>0?promos/ns*100:0, adsVisPct: ns>0?adsVis/ns*100:0 };
    }

    // Aggregate per portal for Base Case
    const portalStats = {};
    portals.forEach(p => {
      const portalData = proj.portals?.[p];
      let ns=0, cm2=0, promos=0, adsVis=0;
      if (portalData?.ns !== undefined) {
        ns=+portalData.ns||0; cm2=+portalData.cm2||0; promos=+portalData.promos||0; adsVis=+portalData.ads||0;
      } else {
        (portalData?.skus||[]).forEach(s => { ns+=+s.netSales||0; cm2+=+s.cm2||0; promos+=+s.promos||0; adsVis+=+s.adsVis||0; });
      }
      portalStats[p] = { ns, cm2, promos, adsVis, cm2Pct: ns>0?cm2/ns*100:0 };
    });

    const base = aggProj(proj);

    // Scenario comparison (only if best/worst exist for same month)
    const bestEntry  = versionsForMonth['Best Case'];
    const worstEntry = versionsForMonth['Worst Case'];
    const bestAgg    = bestEntry  ? aggProj(bestEntry)  : null;
    const worstAgg   = worstEntry ? aggProj(worstEntry) : null;
    // Per-portal cm2Pct for best/worst
    function portalCM2Pcts(entry) {
      const stats = {};
      portals.forEach(p => {
        const pd = entry.portals?.[p];
        let ns=0, cm2=0;
        if (pd?.ns !== undefined) { ns=+pd.ns||0; cm2=+pd.cm2||0; }
        else { (pd?.skus||[]).forEach(s => { ns+=+s.netSales||0; cm2+=+s.cm2||0; }); }
        stats[p] = ns>0 ? cm2/ns*100 : 0;
      });
      return stats;
    }

    const bestPortal  = bestEntry  ? portalCM2Pcts(bestEntry)  : null;
    const worstPortal = worstEntry ? portalCM2Pcts(worstEntry) : null;

    const scenarioLine = (bestAgg || worstAgg)
      ? `<div style="margin-top:8px;font-size:10px;color:#5B7A9D;font-weight:600;display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
          ${bestAgg  ? `<span>▲ Best Case CM2%: <span style="color:#00D68F;font-weight:700">${bestAgg.cm2Pct.toFixed(2)}%</span></span>` : ''}
          ${worstAgg ? `<span>▼ Worst Case CM2%: <span style="color:#FF4D6A;font-weight:700">${worstAgg.cm2Pct.toFixed(2)}%</span></span>` : ''}
        </div>` : '';

    // Right section: base portal row always; best/worst rows if available
    const portalBaseRow = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${portals.map(p=>`<div class="metric-pill"><span class="metric-pill-label" style="color:${pColor[p]};">${pLabel[p]}</span><span class="metric-pill-value ${portalStats[p].cm2Pct>=0?'positive':'negative'}">${portalStats[p].cm2Pct.toFixed(2)}%</span></div>`).join('')}
      </div>`;
    // scenario rows — 4 equal flex cols matching pill layout (Base Case label + 3 portals)
    const colStyle = 'flex:1;text-align:center;font-size:10px;font-weight:700';
    const portalBestRow = bestPortal ? `
      <div style="display:flex;align-items:center;margin-top:7px">
        <div style="${colStyle};font-size:9px;color:#00D68F">▲ Best Case</div>
        ${portals.map(p=>`<div style="${colStyle};color:${bestPortal[p]>=0?'#00D68F':'#FF4D6A'}">${bestPortal[p].toFixed(2)}%</div>`).join('')}
      </div>` : '';
    const portalWorstRow = worstPortal ? `
      <div style="display:flex;align-items:center;margin-top:4px">
        <div style="${colStyle};font-size:9px;color:#FF4D6A">▼ Worst Case</div>
        ${portals.map(p=>`<div style="${colStyle};color:${worstPortal[p]>=0?'#00D68F':'#FF4D6A'}">${worstPortal[p].toFixed(2)}%</div>`).join('')}
      </div>` : '';

    el.innerHTML = `
      <div class="row-section">
        <div class="row-section-title">${month} · ${label} · Combined</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Net Sales</span><span class="metric-pill-value neutral">${fmt(base.ns)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Blended CM2%</span><span class="metric-pill-value ${base.cm2Pct>=0?'positive':'negative'}">${base.cm2Pct.toFixed(2)}%</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Ads+Vis % NS</span><span class="metric-pill-value negative">${base.adsVisPct.toFixed(2)}%</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Promos % NS</span><span class="metric-pill-value negative">${base.promosPct.toFixed(2)}%</span></div>
        </div>
        ${scenarioLine}
      </div>
      <div class="row-vdivider"></div>
      <div class="row-section">
        <div class="row-section-title">Portal CM2%</div>
        <div class="row-kpis">
          <div class="metric-pill" style="justify-content:center"><span style="color:#a479e2;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em">Base Case</span></div>
          ${portals.map(p=>`<div class="metric-pill"><span class="metric-pill-label" style="color:${pColor[p]};">${pLabel[p]}</span><span class="metric-pill-value ${portalStats[p].cm2Pct>=0?'positive':'negative'}">${portalStats[p].cm2Pct.toFixed(2)}%</span></div>`).join('')}
        </div>
        ${portalBestRow}
        ${portalWorstRow}
      </div>`;

  } catch(e) {
    el.innerHTML = `
      <div class="row-section">
        <div class="row-section-title">Planning Tool</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Portals</span><span class="metric-pill-value neutral">Blinkit · Zepto · Instamart</span></div>
          <div class="metric-pill"><span class="metric-pill-label">Sync</span><span class="metric-pill-value positive">Cross-device ✓</span></div>
        </div>
        <div class="metric-context" style="margin-top:6px;"><span class="metric-context-dot warn"></span>Open dashboard to view projections</div>
      </div>`;
  }
}

// ── QCOM SALES ──
async function loadQCom() {
  const el = document.getElementById('qcom-metrics');
  try {
    const SHEET_ID = '1nJLUs3N1vNECXyZhHM6I9sRjqRr3jC2nNP2oWBnpLNg';
    const GID = '1692284658';
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
    const r = await fetch(url);
    const text = await r.text();

    const rows = text.split('\n').map(row => {
      const cells = []; let cur = ''; let inQ = false;
      for (const ch of row) {
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cells.push(cur.trim()); return cells;
    });

    const parseNum = s => parseFloat((s||'').replace(/,/g,'').replace(/"/g,'')) || 0;
    const clean = s => (s||'').replace(/"/g,'').trim();

    const findRow = (colA, colB) => rows.findIndex(r =>
      clean(r[0]).toLowerCase() === colA.toLowerCase() &&
      clean(r[1]).toLowerCase() === colB.toLowerCase()
    );

    const weekRow = rows[0] || [];
    const bgnRow  = rows[1] || [];
    const endRow  = rows[2] || [];

    const bSalesIdx = findRow('BlinkIt Sales', 'Portal (GRN)');
    const sSalesIdx = findRow('Swiggy Sales', 'Portal');
    const zSalesIdx = findRow('Zepto Sales', 'Portal');

    const blinkitSales = bSalesIdx >= 0 ? rows[bSalesIdx] : [];
    const swiggySales  = sSalesIdx >= 0 ? rows[sSalesIdx] : [];
    const zeptoSales   = zSalesIdx >= 0 ? rows[zSalesIdx] : [];

    // Parse start date from bgnRow — format like "1-Apr", "3-Aug"
    const monthNames = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
    const parseStartDate = (s) => {
      s = clean(s);
      const m = s.match(/(\d+)-([A-Za-z]+)/);
      if (!m) return null;
      const day = parseInt(m[1]);
      const mon = monthNames[m[2].toLowerCase().slice(0,3)];
      if (mon === undefined) return null;
      // Assume FY Apr 2026 onwards — year logic
      const yr = (mon >= 3) ? 2026 : 2027; // Apr=3, Mar=2
      return new Date(yr, mon, day);
    };

    const ytdStart = new Date(2026, 3, 1); // 1 Apr 2026

    // Find last column with data (week start in past or today)
    const today = new Date();
    let lastIdx = -1;
    for (let i = 2; i < weekRow.length; i++) {
      const d = parseStartDate(bgnRow[i]);
      if (!d || d > today) break;
      const b = parseNum(blinkitSales[i]);
      const s = parseNum(swiggySales[i]);
      const z = parseNum(zeptoSales[i]);
      if (b > 0 || s > 0 || z > 0) lastIdx = i;
    }
    if (lastIdx < 0) { el.innerHTML = errorHTML('No QCom data'); return; }

    // Determine latest month from last week's start date
    const lastStartDate = parseStartDate(bgnRow[lastIdx]);
    const latestMonth = lastStartDate ? lastStartDate.getMonth() : -1;
    const latestYear  = lastStartDate ? lastStartDate.getFullYear() : -1;

    // Accumulate by month (start date determines month)
    let ytdB = 0, ytdS = 0, ytdZ = 0;
    let monB = 0, monS = 0, monZ = 0;
    let monLabel = '', monWeekFirst = '', monWeekLast = '';

    // Best week trackers: { val, wk, range }
    let bestYtd  = { B:{val:0,wk:'',range:''}, S:{val:0,wk:'',range:''}, Z:{val:0,wk:'',range:''} };
    let bestMon  = { B:{val:0,wk:'',range:''}, S:{val:0,wk:'',range:''}, Z:{val:0,wk:'',range:''} };

    for (let i = 2; i <= lastIdx; i++) {
      const d = parseStartDate(bgnRow[i]);
      if (!d || d < ytdStart) continue;
      const b = parseNum(blinkitSales[i]);
      const s = parseNum(swiggySales[i]);
      const z = parseNum(zeptoSales[i]);
      const wk    = clean(weekRow[i]);
      const range = clean(bgnRow[i]) + ' – ' + clean(endRow[i]);
      ytdB += b; ytdS += s; ytdZ += z;
      if (b > bestYtd.B.val) bestYtd.B = { val:b, wk, range };
      if (s > bestYtd.S.val) bestYtd.S = { val:s, wk, range };
      if (z > bestYtd.Z.val) bestYtd.Z = { val:z, wk, range };
      // Latest month
      if (d.getMonth() === latestMonth && d.getFullYear() === latestYear) {
        monB += b; monS += s; monZ += z;
        if (!monWeekFirst) monWeekFirst = clean(bgnRow[i]);
        monWeekLast = clean(endRow[i]);
        monLabel = d.toLocaleString('en-IN', { month: 'short', year: '2-digit' }).replace(' ', "'");
        if (b > bestMon.B.val) bestMon.B = { val:b, wk, range };
        if (s > bestMon.S.val) bestMon.S = { val:s, wk, range };
        if (z > bestMon.Z.val) bestMon.Z = { val:z, wk, range };
      }
    }

    const bestRow = (best) => `
      <div style="display:flex;align-items:center;gap:12px;margin-top:6px;">
        <div style="font-size:8px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;">Peak Week</div>
        <div style="display:flex;justify-content:space-around;flex:1;">
          <div style="font-size:9px;font-weight:700;color:#FBAE25;">Blinkit · ${best.B.wk} · ${fmt(best.B.val)}</div>
          <div style="font-size:9px;font-weight:700;color:#E35C25;">Swiggy · ${best.S.wk} · ${fmt(best.S.val)}</div>
          <div style="font-size:9px;font-weight:700;color:#4C94D0;">Zepto · ${best.Z.wk} · ${fmt(best.Z.val)}</div>
        </div>
      </div>`;

    const ytdTotal  = ytdB + ytdS + ytdZ;
    const monTotal  = monB + monS + monZ;
    const ytdRange  = `Apr'26–${monLabel || clean(endRow[lastIdx])}`;
    const monRange  = monWeekFirst && monWeekLast ? `${monWeekFirst} – ${monWeekLast}` : monLabel;

    el.innerHTML = `
      <div class="row-section">
        <div class="row-section-title">FY27 YTD · ${ytdRange}</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Combined Sales</span><span class="metric-pill-value neutral">${fmt(ytdTotal)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#FBAE25;">Blinkit</span><span class="metric-pill-value neutral">${fmt(ytdB)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#E35C25;">Swiggy</span><span class="metric-pill-value neutral">${fmt(ytdS)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#4C94D0;">Zepto</span><span class="metric-pill-value neutral">${fmt(ytdZ)}</span></div>
        </div>
        ${bestRow(bestYtd)}
      </div>
      <div class="row-vdivider"></div>
      <div class="row-section">
        <div class="row-section-title">${monLabel} · ${monRange}</div>
        <div class="row-kpis">
          <div class="metric-pill"><span class="metric-pill-label">Combined Sales</span><span class="metric-pill-value neutral">${fmt(monTotal)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#FBAE25;">Blinkit</span><span class="metric-pill-value neutral">${fmt(monB)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#E35C25;">Swiggy</span><span class="metric-pill-value neutral">${fmt(monS)}</span></div>
          <div class="metric-pill"><span class="metric-pill-label" style="color:#4C94D0;">Zepto</span><span class="metric-pill-value neutral">${fmt(monZ)}</span></div>
        </div>
        ${bestRow(bestMon)}
      </div>`;
  } catch(e) { el.innerHTML = errorHTML('Failed: ' + e.message); }
}

loadQCom();
</script>
